data:
  raw_path: data/raw/Online Retail.xlsx
  processed_path: data/processed/clean_transactions.csv

  required_columns:
    - InvoiceNo
    - StockCode
    - Description
    - Quantity
    - InvoiceDate
    - UnitPrice
    - CustomerID
    - Country

  preprocessing:
    remove_missing_customer: true
    remove_cancellations: true
    min_quantity: 1
    outlier_method: none
